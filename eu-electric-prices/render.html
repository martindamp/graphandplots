<title>Europas Elpriser</title>
<style>
/* Layout: full-screen 9:16 "electric storm" stage, everything drawn on canvas; controls float in the letterbox. Single committed dark theme. */
:root{
  --storm:#05060f; --storm2:#0a0e1f;
  --ink:#eaf3ff; --muted:#7f93bd;
  --cyan:#35e4ff; --hot:#ff4fd8; --amber:#ffd36b;
  --panel:rgba(12,18,38,.72); --edge:rgba(120,160,230,.22);
  color-scheme: dark;
}
html,body{height:100%;}
body{margin:0;background:
    radial-gradient(130% 80% at 50% 0%, #0d1430 0%, var(--storm2) 42%, var(--storm) 100%);
  color:var(--ink);overflow:hidden;
  font-family:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  -webkit-font-smoothing:antialiased;}
#wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px 16px;box-sizing:border-box;}
#stage{position:relative;border-radius:22px;overflow:hidden;
  box-shadow:0 0 0 1px rgba(120,160,230,.18),0 30px 90px -30px rgba(0,0,0,.9),0 0 80px -20px rgba(53,228,255,.25);}
#stage canvas{display:block;width:100%;height:100%;}
#bar{display:flex;gap:10px;align-items:center;transition:opacity .5s;}
#bar.hide{opacity:0;pointer-events:none;}
button{font-family:inherit;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink);background:var(--panel);border:1px solid var(--edge);
  padding:9px 16px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);
  transition:border-color .2s,color .2s;}
button:hover{border-color:var(--cyan);color:var(--cyan);}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
.hint{font-size:11px;color:var(--muted);letter-spacing:.06em;}
@media (prefers-reduced-motion: reduce){ .hint::after{content:" · animation reduced";} }
</style>

const N = DATA.length;
const vals = DATA.map(d=>d.v);
const YMAX = 430;                       // headroom above the 414 peak
let peakI=0, lowI=0;
vals.forEach((v,i)=>{ if(v>vals[peakI])peakI=i; if(v<vals[lowI])lowI=i; });

// ---- timeline (seconds) ----
const T_INTRO=2.2, T_DRAW0=2.2, T_DRAW1=12.4, T_END=15.0, T_LOOP=16.2;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

const stage=document.getElementById('c').parentElement;
const wrap=document.getElementById('wrap');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
let dpr=Math.min(devicePixelRatio||1,2.5);
let W=0,H=0;

function layout(){
  const aw=wrap.clientWidth, ah=wrap.clientHeight-54;
  let h=ah, w=h*9/16;
  if(w>aw){ w=aw; h=w*16/9; }
  stage.style.width=w+'px'; stage.style.height=h+'px';
  W=w; H=h;
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',layout); layout();

// ---- chart geometry (in CSS px of the stage) ----
function geom(){
  const padL=W*0.085, padR=W*0.075;
  const top=H*0.205, bot=H*0.845;
  return {padL,padR,top,bot,
    x:i=>padL+(W-padL-padR)*(i/(N-1)),
    y:v=>bot-(bot-top)*(Math.min(v,YMAX)/YMAX)};
}

// ---- colour helpers ----
function hx(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
const C_CY=hx('35e4ff'), C_HOT=hx('ff4fd8'), C_WH=[255,255,255];
function lerp(a,b,t){return a+(b-a)*t;}
function mix(c1,c2,t){return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)];}
function rgba(c,a){return `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;}
// value 0..1 -> electric colour: cyan -> magenta -> white-hot
function heat(nv){
  if(nv<0.6) return mix(C_CY,C_HOT,nv/0.6);
  return mix(C_HOT,C_WH,(nv-0.6)/0.4);
}

// ---- lightning ----
function bolt(x1,y1,x2,y2,disp,detail){
  if(disp<detail) return [[x1,y1,x2,y2]];
  let mx=(x1+x2)/2,my=(y1+y2)/2;
  const dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1;
  const off=(Math.random()-0.5)*disp;
  mx+=(-dy/len)*off; my+=(dx/len)*off;
  let s=bolt(x1,y1,mx,my,disp/2,detail).concat(bolt(mx,my,x2,y2,disp/2,detail));
  if(Math.random()<0.35 && disp>14){
    const a=Math.atan2(my-y1,mx-x1)+(Math.random()-0.5)*1.4, bl=disp*1.6;
    s=s.concat(bolt(mx,my,mx+Math.cos(a)*bl,my+Math.sin(a)*bl,disp/2,detail));
  }
  return s;
}
let bolts=[]; // {segs,born,life,w,col}
function spawnBolt(x,y,tx,ty,disp,life,w,col){
  bolts.push({segs:bolt(x,y,tx,ty,disp,3.5),born:now,life,w,col});
}
function drawBolts(){
  ctx.lineCap='round';ctx.lineJoin='round';
  for(const b of bolts){
    const age=(now-b.born)/b.life; if(age>=1)continue;
    const a=(1-age)*(1-age);
    // outer glow
    ctx.globalCompositeOperation='lighter';
    ctx.strokeStyle=rgba(b.col,0.5*a); ctx.lineWidth=b.w*3.2; ctx.shadowBlur=26; ctx.shadowColor=rgba(b.col,0.9*a);
    ctx.beginPath(); for(const s of b.segs){ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);} ctx.stroke();
    // bright core
    ctx.strokeStyle=rgba([255,255,255],0.95*a); ctx.lineWidth=b.w; ctx.shadowBlur=10;
    ctx.beginPath(); for(const s of b.segs){ctx.moveTo(s[0],s[1]);ctx.lineTo(s[2],s[3]);} ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  bolts=bolts.filter(b=>(now-b.born)<b.life);
}

// ---- text helpers ----
function setFont(px,fam,w){ctx.font=(w?w+' ':'')+px+'px '+fam;}
const DISP='"Anton",system-ui,sans-serif', MONO='"IBM Plex Mono",monospace';
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function label(m){const[y,mo]=m.split('-');return MONTHS[+mo-1]+' '+y;}

// ---- scene pieces ----
let flash=0, peakFired=false, lowFired=false;

function drawBackgroundFX(t){
  // faint vertical energy haze
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(53,228,255,0.05)');g.addColorStop(0.5,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(176,107,255,0.05)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
}

function drawAxes(headI){
  const G=geom();
  ctx.save();
  // horizontal gridlines
  ctx.font='600 '+(W*0.026)+'px '+MONO;
  ctx.textBaseline='middle';
  [100,200,300,400].forEach(v=>{
    const y=G.y(v);
    ctx.strokeStyle='rgba(120,160,230,0.12)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(G.padL,y);ctx.lineTo(W-G.padR,y);ctx.stroke();
    ctx.fillStyle='rgba(143,167,205,0.7)';ctx.textAlign='right';
    ctx.fillText(v, G.padL-W*0.018, y);
  });
  // year ticks
  ctx.textAlign='center';ctx.textBaseline='alphabetic';
  ctx.font='600 '+(W*0.028)+'px '+MONO;
  for(let i=0;i<N;i++){
    const [y,mo]=DATA[i].m.split('-');
    if(mo==='01'){
      const x=G.x(i), passed = i<=headI;
      ctx.fillStyle = passed? 'rgba(234,243,255,0.92)':'rgba(143,167,205,0.4)';
      ctx.fillText("'"+y.slice(2), x, G.bot+H*0.045);
      ctx.strokeStyle= passed?'rgba(53,228,255,0.5)':'rgba(120,160,230,0.15)';
      ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,G.bot);ctx.lineTo(x,G.bot+H*0.016);ctx.stroke();
    }
  }
  ctx.restore();
}

function drawLine(frac){
  const G=geom();
  const headF=frac*(N-1);
  const hi=Math.floor(headF), hf=headF-hi;
  // build visible points
  const pts=[];
  for(let i=0;i<=hi;i++) pts.push([G.x(i),G.y(vals[i]),vals[i]/YMAX]);
  let headX,headY,headNV;
  if(hi<N-1){
    headX=lerp(G.x(hi),G.x(hi+1),hf);
    headY=lerp(G.y(vals[hi]),G.y(vals[hi+1]),hf);
    headNV=lerp(vals[hi],vals[hi+1],hf)/YMAX;
  }else{headX=G.x(N-1);headY=G.y(vals[N-1]);headNV=vals[N-1]/YMAX;}
  pts.push([headX,headY,headNV]);

  // area fill under curve
  ctx.beginPath();ctx.moveTo(pts[0][0],G.bot);
  for(const p of pts)ctx.lineTo(p[0],p[1]);
  ctx.lineTo(headX,G.bot);ctx.closePath();
  const ag=ctx.createLinearGradient(0,G.top,0,G.bot);
  ag.addColorStop(0,'rgba(53,228,255,0.30)');ag.addColorStop(0.6,'rgba(120,80,255,0.10)');ag.addColorStop(1,'rgba(53,228,255,0)');
  ctx.fillStyle=ag;ctx.fill();

  // glowing line, coloured by local value
  ctx.lineJoin='round';ctx.lineCap='round';
  ctx.globalCompositeOperation='lighter';
  for(let i=1;i<pts.length;i++){
    const nv=Math.max(pts[i][2],pts[i-1][2]);
    const col=heat(nv);
    ctx.strokeStyle=rgba(col,0.9);
    ctx.lineWidth=Math.max(2.2,W*0.006)+nv*W*0.004;
    ctx.shadowBlur=14+nv*34;ctx.shadowColor=rgba(col,0.9);
    ctx.beginPath();ctx.moveTo(pts[i-1][0],pts[i-1][1]);ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();
  }
  ctx.globalCompositeOperation='source-over';ctx.shadowBlur=0;
  return {headX,headY,headNV,hi};
}

function drawHead(x,y,nv){
  const col=heat(nv);
  ctx.globalCompositeOperation='lighter';
  const r=W*0.02*(1+nv);
  const g=ctx.createRadialGradient(x,y,0,x,y,r*2.6);
  g.addColorStop(0,rgba([255,255,255],0.95));g.addColorStop(0.3,rgba(col,0.8));g.addColorStop(1,rgba(col,0));
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.6,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,Math.max(2.4,W*0.008),0,7);ctx.fill();
  ctx.globalCompositeOperation='source-over';
}

function drawPriceChip(x,y,val){
  const G=geom();
  const big=Math.round(val);
  setFont(W*0.1,DISP);
  const num=big.toLocaleString('en-US');
  const nw=ctx.measureText(num).width;
  const unitw=W*0.09;
  const bw=nw+unitw+W*0.07, bh=W*0.14;
  let bx=x - bw/2; let by=y - bh - W*0.05;
  bx=Math.max(G.padL, Math.min(bx, W-G.padR-bw));
  by=Math.max(H*0.04, by);
  // panel
  ctx.fillStyle='rgba(8,12,28,0.6)';
  rr(bx,by,bw,bh,W*0.03);ctx.fill();
  ctx.strokeStyle='rgba(53,228,255,0.35)';ctx.lineWidth=1.3;rr(bx,by,bw,bh,W*0.03);ctx.stroke();
  // number
  ctx.textBaseline='middle';ctx.textAlign='left';
  ctx.fillStyle='#fff';ctx.shadowBlur=18;ctx.shadowColor='rgba(53,228,255,0.8)';
  setFont(W*0.1,DISP);
  ctx.fillText(num, bx+W*0.035, by+bh*0.54);
  ctx.shadowBlur=0;
  ctx.fillStyle='var(--cyan)';ctx.fillStyle='#9fe9ff';
  setFont(W*0.03,MONO,'600');
  ctx.fillText('€/MWh', bx+W*0.035+nw+W*0.016, by+bh*0.56);
}

function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

function marker(i,text,col,appearFrac,frac){
  if(frac<appearFrac)return;
  const G=geom();const x=G.x(i),y=G.y(vals[i]);
  const a=Math.min(1,(frac-appearFrac)/0.03);
  ctx.save();ctx.globalAlpha=a;
  // ring
  ctx.strokeStyle=rgba(col,0.9);ctx.lineWidth=2;ctx.shadowBlur=16;ctx.shadowColor=rgba(col,0.8);
  ctx.beginPath();ctx.arc(x,y,W*0.018,0,7);ctx.stroke();ctx.shadowBlur=0;
  // callout text, above for peak, below for low
  const up = i===peakI;
  setFont(W*0.032,MONO,'600');ctx.textAlign='center';
  const ty = up ? y - W*0.05 : y + W*0.075;
  ctx.fillStyle=rgba(col,1);
  ctx.textBaseline='middle';
  text.split('\n').forEach((ln,k)=>{
    ctx.fillText(ln, x, ty + k*W*0.042 * (up?-1:1) * (up? -0 : 0) + k*W*0.04);
  });
  ctx.restore();
}

function drawHeader(frac, introA){
  const G=geom();
  // compact top identity (fades in as chart begins)
  const ca=1-introA;
  if(ca>0.01){
    ctx.save();ctx.globalAlpha=ca;
    ctx.textAlign='left';ctx.textBaseline='alphabetic';
    ctx.fillStyle='#8da2c8';setFont(W*0.03,MONO,'600');
    ctx.fillText('AVERAGE WHOLESALE PRICE · EUROPE', G.padL, H*0.075);
    ctx.fillStyle='#eaf3ff';setFont(W*0.062,DISP);
    ctx.fillText('POWER PRICES 2015–26', G.padL, H*0.135);
    ctx.restore();
  }
}

function drawIntro(t){
  const a = reduce?0 : (t<T_INTRO? 1 : Math.max(0,1-(t-T_INTRO)/0.5));
  if(a<=0.01) return 0;
  ctx.save();ctx.globalAlpha=a;
  // intro lightning flashes
  if(!reduce && Math.random()<0.25){
    spawnBolt(W*(0.2+Math.random()*0.6),0, W*(0.2+Math.random()*0.6),H, H*0.22,0.18, Math.max(1.6,W*0.004), C_CY);
  }
  ctx.textAlign='center';
  ctx.fillStyle='#8da2c8';setFont(W*0.038,MONO,'600');
  ctx.fillText('2015  ———  2026', W/2, H*0.40);
  ctx.fillStyle='#fff';ctx.shadowBlur=30;ctx.shadowColor='rgba(53,228,255,0.7)';
  setFont(W*0.125,DISP);
  ctx.fillText('EUROPEAN', W/2, H*0.50);
  ctx.fillText('POWER PRICES', W/2, H*0.50+W*0.125);
  ctx.shadowBlur=0;
  ctx.fillStyle='#9fe9ff';setFont(W*0.03,MONO);
  ctx.fillText('€ PER MWh · WHOLESALE (DAY-AHEAD)', W/2, H*0.50+W*0.125+W*0.07);
  ctx.restore();
  return a;
}

function drawFooter(){
  const G=geom();
  ctx.textAlign='left';ctx.textBaseline='alphabetic';
  ctx.fillStyle='rgba(143,167,205,0.6)';setFont(W*0.025,MONO);
  ctx.fillText('Source: Ember · ENTSO-E  ·  avg. of 32 countries', G.padL, H*0.96);
}

// ---- main loop ----
let start=null, now=0;
function renderFrame(){
  ctx.clearRect(0,0,W,H);
  drawBackgroundFX(now);

  const introA = drawIntro(now);
  const drawFrac = reduce?1:Math.min(1,Math.max(0,(now-T_DRAW0)/(T_DRAW1-T_DRAW0)));
  const chartA = reduce?1:(1-introA);

  if(chartA>0.01){
    ctx.save();ctx.globalAlpha=chartA;
    drawAxes(Math.floor(drawFrac*(N-1)));
    const h=drawLine(drawFrac);
    // markers
    marker(lowI, 'COVID · €21', C_CY, lowI/(N-1), drawFrac);
    marker(peakI,'ENERGY CRISIS\n€414', C_HOT, peakI/(N-1), drawFrac);

    // lightning from head, intensity scales with value
    if(!reduce && drawFrac<1){
      const nv=h.headNV;
      const chance=0.12+nv*nv*0.75;
      if(Math.random()<chance){
        const ang=-Math.PI/2+(Math.random()-0.5)*2.2;
        const d=H*(0.05+nv*0.4);
        spawnBolt(h.headX,h.headY, h.headX+Math.cos(ang)*d, h.headY+Math.sin(ang)*d, H*(0.04+nv*0.16), 0.16+nv*0.1, Math.max(1.4,W*0.0035)+nv*W*0.004, heat(nv));
      }
      // peak dramatic strike
      const headI=drawFrac*(N-1);
      if(!peakFired && headI>=peakI){
        peakFired=true; flash=1;
        const G=geom();
        spawnBolt(G.x(peakI),0, G.x(peakI),G.y(vals[peakI]), H*0.22,0.4, Math.max(2.5,W*0.009), C_WH);
        spawnBolt(G.x(peakI),0, G.x(peakI)+W*0.1,G.y(vals[peakI]), H*0.18,0.35, Math.max(2,W*0.006), C_HOT);
      }
    }
    drawBolts();
    drawHead(h.headX,h.headY,h.headNV);
    drawPriceChip(h.headX,h.headY, reduce?vals[N-1]:lerpVal(drawFrac));
    drawFooter();
    ctx.restore();
  } else {
    drawBolts();
  }

  drawHeader(drawFrac, introA);

  // screen flash on peak
  if(flash>0.01){
    ctx.fillStyle=rgba([255,255,255],flash*0.5);ctx.fillRect(0,0,W,H);
    flash*=0.86;
  }
  // subtle vignette
  const vg=ctx.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}
function frame(ts){
  if(start===null)start=ts;
  now=(ts-start)/1000;
  if(now>T_LOOP){ start=ts; now=0; bolts=[]; peakFired=false; lowFired=false; flash=0; }
  renderFrame();
  requestAnimationFrame(frame);
}
function lerpVal(frac){
  const f=frac*(N-1),i=Math.floor(f),fr=f-i;
  if(i>=N-1)return vals[N-1];
  return lerp(vals[i],vals[i+1],fr);
}

// controls
const bar=document.getElementById('bar');
document.getElementById('replay').onclick=()=>{start=null;bolts=[];peakFired=false;flash=0;};
let hideT;
function pokeBar(){bar.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>bar.classList.add('hide'),3500);}
addEventListener('pointermove',pokeBar);addEventListener('pointerdown',pokeBar);pokeBar();

// ---- capture API (for offline MP4 render; invisible to normal viewers) ----
const CAP = location.hash.indexOf('capture')>=0;
window.__setup=function(w,h){dpr=1;W=w;H=h;canvas.width=w;canvas.height=h;ctx.setTransform(1,0,0,1,0,0);};
window.__render=function(t){now=t;renderFrame();};
window.__reset=function(){bolts=[];peakFired=false;lowFired=false;flash=0;};

// start once fonts ready (so canvas text uses Anton/Plex)
function go(){layout();requestAnimationFrame(frame);}
function boot(){ if(!CAP) go(); window.__ready=true; }
if(document.fonts&&document.fonts.ready){Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]).then(boot);}else{boot();}
</script>
