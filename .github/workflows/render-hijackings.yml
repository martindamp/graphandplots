name: Render hijackings video

# Koden ligger i undermappen aircraft-hijackings/.
# Selve workflow-filen SKAL ligge i repo-roden under .github/workflows/ —
# GitHub Actions kører ikke workflows fra en undermappe.
#
# Kør manuelt (Actions-fanen → Render hijackings video → Run workflow),
# ved push til main, eller ved push af et tag (vedhæfter MP4'en til en Release).
on:
  workflow_dispatch:
  
permissions:
  contents: write   # nødvendigt for at vedhæfte filen til en Release ved tag-push

defaults:
  run:
    working-directory: aircraft-hijackings

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm install

      - name: Install Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Render MP4
        run: node make_video.js

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aircraft_hijackings
          path: aircraft-hijackings/aircraft_hijackings.mp4
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release (kun ved tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: aircraft-hijackings/aircraft_hijackings.mp4
